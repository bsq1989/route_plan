[project]
name = "route-plan-planner"
version = "0.3.0"
description = "Static task and motion planning baseline for route-plan-sim"
requires-python = ">=3.11"
dependencies = ["route-plan-sim", "ompl==2.0.1"]

[project.scripts]
route-plan = "route_plan_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/route_plan_planner"]

[tool.uv.sources]
route-plan-sim = { path = "../sim", editable = true }
