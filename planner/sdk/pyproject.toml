[project]
name = "route-plan-sdk"
version = "0.2.6"
description = "Headless task and path planning for circular target collection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.3", "ompl==2.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/route_plan_sdk"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/examples", "/README.md", "/pyproject.toml"]
