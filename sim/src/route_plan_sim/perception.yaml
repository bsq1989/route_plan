# Example planar mounts in body coordinates. These are not calibrated values.
cameras:
  bottom:
    frame_id: bottom_camera
    mount_xy_yaw_deg: [0.08, -0.04, -3]
    horizontal_fov_deg: 115
    max_range_m: 7
    range_error_per_m: 0.25
    merge_angle_deg: 8
  local:
    frame_id: local_camera
    mount_xy_yaw_deg: [0.27, 0.04, 2]
    horizontal_fov_deg: 28
    max_range_m: 2.8
cases:
  range-bias:
    title: 远处 XY 有偏差
    targets: [[6.35, 6.55]]
    # The SDK turn leaves this target out of range. Move closer for the handoff.
    observation_poses_xy_yaw_deg: [[4.65, 5.51, 31.5]]
  occlusion:
    title: 障碍物遮挡
    targets: [[5.65, 4.5]]
    obstacles: [[4.25, 4.5, 0.30]]  # x, y, radius, metres
    observation_poses_xy_yaw_deg: [[4.2, 3.4, 20]]
  shared-bearing:
    title: 同方向多个目标
    targets: [[4.90, 5.68], [5.25, 6.05]]
