[project]
name = "route-plan-sim"
version = "0.1.0"
description = "Standalone IR-SIM scene for a forward-only target collection robot"
requires-python = ">=3.11"
dependencies = [
    "ir-sim==2.12.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
route-sim = "route_plan_sim.app:main"
route-sim-perception = "route_plan_sim.perception_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/route_plan_sim"]

[tool.hatch.build.targets.wheel.force-include]
"config/robot.yaml" = "route_plan_sim/config/robot.yaml"
