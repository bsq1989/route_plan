[project]
name = "active-perception-sdk"
version = "0.1.0"
description = "Observation heading suggestions from horizontal camera bearings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/active_perception_sdk"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/examples", "/tests", "/README.md", "/pyproject.toml"]
